# Runs the unit-test suite on every push to main and every pull request.
# The Xcode project is generated by XcodeGen, and the key placeholder is
# replaced with a blank key: tests exercise stub clients, never the network.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-15 # XcodeGen produces project format 77, which needs Xcode 16+
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare key placeholder
        run: |
          cp Airpisode/TMDBKey.xcconfig.example Airpisode/TMDBKey.xcconfig
          sed -i '' 's/REPLACE_ME//' Airpisode/TMDBKey.xcconfig

      - name: Generate project
        run: xcodegen generate

      - name: Run tests
        run: xcodebuild test -project Airpisode.xcodeproj -scheme Airpisode -destination 'platform=macOS'

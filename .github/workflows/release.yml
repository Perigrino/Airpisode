# On a pushed v* tag: run the test suite, build the DMG, and publish it to a
# GitHub release with its sha256 checksum in the notes. When the optional
# signing secrets are present the DMG is Developer ID signed and notarized;
# when SPARKLE_ED_PRIVATE_KEY is present the signed appcast is published too.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release (macOS)
    runs-on: macos-15 # XcodeGen produces project format 77, which needs Xcode 16+
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare key placeholder
        run: |
          cp Airpisode/TMDBKey.xcconfig.example Airpisode/TMDBKey.xcconfig
          sed -i '' 's/REPLACE_ME//' Airpisode/TMDBKey.xcconfig

      - name: Generate project
        run: xcodegen generate

      - name: Run tests
        run: xcodebuild test -project Airpisode.xcodeproj -scheme Airpisode -destination 'platform=macOS'

      # Optional: without these secrets the build falls back to ad-hoc signing,
      # which is fine to share but cannot install updates.
      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "No BUILD_CERTIFICATE_BASE64 secret; the DMG will be ad-hoc signed."
            exit 0
          fi
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build DMG
        env:
          VERSION: ${{ github.ref_name }}
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          TEAM_ID: ${{ secrets.DEVELOPMENT_TEAM }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          VERSION="${VERSION#v}"
          if [ -n "$SIGN_IDENTITY" ]; then
            NOTARIZE=1 \
            AIRPISODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            VERSION="$VERSION" \
            ./Scripts/build-dmg.sh
          else
            VERSION="$VERSION" ./Scripts/build-dmg.sh
          fi

      - name: Checksum and release notes
        run: |
          DMG=$(ls dist/Airpisode-*.dmg)
          VERSION=$(basename "$DMG" .dmg | sed 's/^Airpisode-//')
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          NOTES="dist/Airpisode-${VERSION}.md"
          {
            echo "Download the DMG, open it, and drag Airpisode to Applications."
            echo "The bundle ships keyless: enter your own TMDB key on first launch."
            echo "Existing copies update from the menu (⇧⌘U) once the appcast is published."
            echo ""
            echo "---"
            echo ""
            echo "**\`$(basename "$DMG")\`** \`${SHA}\` (sha256)"
          } > "$NOTES"
          cp "$NOTES" dist/notes.md

      # Optional: without the EdDSA key there is no appcast to publish, and the
      # release is a plain download. docs/UPDATES.md explains the secrets.
      - name: Generate signed appcast
        id: appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "No SPARKLE_ED_PRIVATE_KEY secret; skipping the appcast."
            exit 0
          fi
          ./Scripts/make-appcast.sh
          echo "file=dist/appcast.xml" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Airpisode ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/Airpisode-*.dmg
            ${{ steps.appcast.outputs.file }}

name: Airpisode
options:
  bundleIdPrefix: com.airpisode
  deploymentTarget:
    macOS: "13.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.1"
targets:
  Airpisode:
    type: application
    platform: macOS
    sources:
      - path: Airpisode
        excludes:
          - "TMDBKey.xcconfig.example"
          - "TMDBKey.xcconfig"
          - "Config/Sparkle.local.xcconfig"
          - "Config/Sparkle.local.xcconfig.example"
      - path: Icon
    dependencies:
      - package: Sparkle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Airpisode/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "3.0.4"
        CURRENT_PROJECT_VERSION: "1"
    configFiles:
      Debug: Airpisode/Config/App.xcconfig
      Release: Airpisode/Config/App.xcconfig
  AirpisodeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AirpisodeTests
        excludes:
          - "Fixtures/**"
      - path: AirpisodeTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Airpisode
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
